services:
  beressuite-app:
    build:
      context: ./
      dockerfile: Dockerfile
    image: beressuite/app:latest
    container_name: beressuite-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - beressuite-storage:/var/www/storage
      - ./docker-compose/php/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini:ro
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: mysql
      DB_HOST: beressuite-db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-beressuite}
      DB_USERNAME: ${DB_USERNAME:-beressuite}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
    networks:
      - beressuite-network
    depends_on:
      - beressuite-db

  beressuite-web:
    image: nginx:1.27-alpine
    container_name: beressuite-web
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      - ./docker-compose/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - beressuite-storage:/var/www/storage:ro
    networks:
      - beressuite-network
    depends_on:
      - beressuite-app

  beressuite-db:
    image: mariadb:11.4
    container_name: beressuite-db
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-beressuite}
      MYSQL_USER: ${DB_USERNAME:-beressuite}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret}
    volumes:
      - beressuite-db-data:/var/lib/mysql
    networks:
      - beressuite-network

  beressuite-cron:
    build:
      context: ./
      dockerfile: ./docker-compose/cron.dockerfile
    container_name: beressuite-cron
    restart: unless-stopped
    volumes:
      - beressuite-storage:/var/www/storage
    networks:
      - beressuite-network
    depends_on:
      - beressuite-app

  # ----------------------------------------------------------------------------
  # Optional: Automated Container Deployment with Watchtower
  # ----------------------------------------------------------------------------
  # To enable automated updates for your BeresSuite containers without running
  # in-app PHP self-updaters, uncomment the service block below.
  # Watchtower will periodically monitor your Docker image tags, pull the newest
  # release from the registry, and safely recreate containers.
  #
  # beressuite-watchtower:
  #   image: containrrr/watchtower:latest
  #   container_name: beressuite-watchtower
  #   restart: unless-stopped
  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock
  #   environment:
  #     # Poll interval in seconds (e.g. 300 = every 5 minutes)
  #     WATCHTOWER_POLL_INTERVAL: 300
  #     # Automatically remove old unused images after updating
  #     WATCHTOWER_CLEANUP: "true"
  #     # Restart containers with the same flags/networks
  #     WATCHTOWER_INCLUDE_RESTARTING: "true"
  #   networks:
  #     - beressuite-network

volumes:
  beressuite-db-data:
    name: beressuite-db-data
  beressuite-storage:
    name: beressuite-storage

networks:
  beressuite-network:
    name: beressuite-network
    driver: bridge
